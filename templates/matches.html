<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Match Items - FindIt</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
        }

        header {
            background: #0b5ed7;
            color: white;
            padding: 20px;
            text-align: center;
        }

        main {
            max-width: 800px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            margin-top: 20px;
            width: 100%;
            padding: 12px;
            background: #0b5ed7;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 40px;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #0b5ed7;
            color: white;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            color: #0b5ed7;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>FindIt</h1>
        <p>Match a lost item with a found item</p>
    </header>

    <main>
        <h2>Create a Match</h2>

        <form action="/matches" method="POST">
            <label for="lost_item_id">Lost Item</label>
            <select name="lost_item_id" required>
                <option value="">Select lost item</option>

                {% for item in lost_items %}
                <option value="{{ item.id }}">
                    {{ item.id }} - {{ item.item_name }} ({{ item.category }})
                </option>
                {% endfor %}
            </select>

            <label for="found_item_id">Found Item</label>
            <select name="found_item_id" required>
                <option value="">Select found item</option>

                {% for item in found_items %}
                <option value="{{ item.id }}">
                    {{ item.id }} - {{ item.item_name }} ({{ item.category }})
                </option>
                {% endfor %}
            </select>

            <button type="submit">Create Match</button>
        </form>

        <h2>All Matches</h2>

        <table>
            <tr>
                <th>Match ID</th>
                <th>Lost Item</th>
                <th>Found Item</th>
                <th>Date</th>
                <th>Status</th>
            </tr>

            {% for match in all_matches %}
            <tr>
                <td>{{ match.id }}</td>
                <td>{{ match.lost_item }}</td>
                <td>{{ match.found_item }}</td>
                <td>{{ match.match_date }}</td>
                <td>{{ match.status }}</td>
            </tr>
            {% endfor %}
        </table>

        <a class="back" href="/">Back to Home</a>
    </main>

</body>
</html>
