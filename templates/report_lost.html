{% extends "base.html" %}

{% block title %}Report Lost Item - FindIt{% endblock %}

{% block content %}
<h2>Report Lost Item</h2>

<form action="/report-lost" method="POST" onsubmit="return validateForm();">
    <label for="item_name">Item Name</label>
    <input type="text" id="item_name" name="item_name" required>

    <label for="category">Category</label>
    <select id="category" name="category" required>
        <option value="">Select category</option>
        <option value="Phone">Phone</option>
        <option value="ID or Card">ID or Card</option>
        <option value="Bag">Bag</option>
        <option value="Keys">Keys</option>
        <option value="Wallet">Wallet</option>
        <option value="Laptop">Laptop</option>
        <option value="Documents">Documents</option>
        <option value="Other">Other</option>
    </select>

    <label for="color">Color</label>
    <input type="text" id="color" name="color">

    <label for="brand">Brand</label>
    <input type="text" id="brand" name="brand">

    <label for="description">Description</label>
    <textarea id="description" name="description" rows="4"></textarea>

    <label for="location">Location Lost</label>
    <input type="text" id="location" name="location" required>

    <label for="date_lost">Date Lost</label>
    <input type="date" id="date_lost" name="date_lost" required>

    <label for="contact">Contact</label>
    <input type="text" id="contact" name="contact" required>

    <button type="submit">Submit Lost Item</button>
</form>

<script>
    function validateForm() {
        let itemName = document.getElementById("item_name").value;
        let category = document.getElementById("category").value;
        let location = document.getElementById("location").value;
        let contact = document.getElementById("contact").value;

        if (itemName === "" || category === "" || location === "" || contact === "") {
            alert("Please fill in all required fields.");
            return false;
        }

        return true;
    }
</script>
{% endblock %}
